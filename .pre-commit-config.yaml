repos:
  - repo: local
    hooks:
      - id: lint-py
        name: ruff, black
        entry: sh -c 'make -s ruff black FILES="$*"' --
        language: system
        types: [python]
      - id: lint-rst
        name: rstcheck, rstwrap
        entry: sh -c 'make -s lint-rst FILES="$*"' --
        language: system
        types: [rst]
      - id: dprint
        name: dprint
        entry: sh -c 'make -s dprint FILES="$*"' --
        language: system
        types: [markdown]
      - id: lint-toml
        name: toml-sort
        entry: sh -c 'make -s lint-toml FILES="$*"' --
        language: system
        types: [toml]
