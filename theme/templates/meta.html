{% macro og_tags(title, description, url, og_type='website', date=None, modified=None, tags=[]) %}
<link rel="canonical" href="{{ url }}">
<meta name="description" content="{{ description }}">
<meta property="og:site_name" content="{{ SITENAME }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:type" content="{{ og_type }}">
<meta property="og:url" content="{{ url }}">
<meta property="og:image" content="{{ SITEURL }}/images/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
{% if date %}<meta property="article:published_time" content="{{ date.isoformat() }}">{% endif %}
{% if modified %}<meta property="article:modified_time" content="{{ modified.isoformat() }}">{% endif %}
{% for tag in tags %}<meta property="article:tag" content="{{ tag }}">
{% endfor %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ SITEURL }}/images/og-image.png">
{% endmacro %}
