on: [push, pull_request]
name: tests
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha || '' }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PIP: uv pip
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
          activate-environment: true
      - name: Install deps
        run: make install-pydeps
      - name: Tests
        run: make test

  linters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
          activate-environment: true
      - name: Cache dprint
        uses: actions/cache@v6
        with:
          path: |
            ~/.dprint
            ~/.cache/dprint
          key: dprint-${{ hashFiles('.dprint.jsonc') }}
      - name: Install deps
        run: make install-sysdeps install-pydeps
      - name: Linters
        run: make lint-all
